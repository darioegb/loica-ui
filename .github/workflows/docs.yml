name: Docs

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - packages/react/src/components/**/stories/**
      - .github/workflows/docs.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The docs follow the version on npm: deploying main with changesets that aren't published yet would
      # document an API that nobody can install. A push with them pending leaves the deploy to the release, and
      # a manual run says so.
      - name: Check there is nothing unreleased
        id: guard
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -z "$pending" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$pending"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::main has changesets that aren't published yet. Release them first, or wait for the release to deploy the docs."
            exit 1
          fi
          echo "::notice::main has changesets that aren't published yet, so the docs deploy with the release."
          echo "deploy=false" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.guard.outputs.deploy == 'true'
        uses: ./.github/composite-actions/common

      - name: Build docs
        if: steps.guard.outputs.deploy == 'true'
        run: pnpm build:docs

      - name: Setup Pages
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/storybook-static

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
