name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/common
      
      - name: Lint
        run: pnpm lint

      - name: Test and coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm build

      - name: Check the package
        run: pnpm --filter @loica-ui/react check:package
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/composite-actions/common

      - name: Build docs
        run: pnpm build:docs

      - name: Install the browser
        run: pnpm --filter @loica-ui/docs exec playwright install --with-deps chromium

      - name: Check the stories with axe
        run: pnpm --filter @loica-ui/docs check:a11y

  examples:
    name: Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [example-next-app, example-vite]
    defaults:
      run:
        working-directory: apps/${{ matrix.example }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.example }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
