name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      library: ${{ steps.filter.outputs.library }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - name: Detect the changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            library:
              - 'packages/**'
              - 'apps/docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/build.yml'
              - '.github/composite-actions/**'
            examples:
              - 'apps/example-*/**'
              - '.nvmrc'
              - '.github/workflows/build.yml'

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/common

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test and coverage
        run: pnpm run test:coverage

      - name: Check the package
        run: pnpm --filter @loica-ui/react check:package

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  accessibility:
    name: Accessibility (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/composite-actions/common

      - name: Build docs
        run: pnpm build:docs

      - name: Install the browser and its system packages
        id: browser
        continue-on-error: true
        timeout-minutes: 4
        run: pnpm --filter @loica-ui/docs exec playwright install --with-deps chromium

      # The system libraries come with the runner image; --with-deps only adds fonts through apt, whose mirrors can be down.
      - name: Install the browser alone when apt fails
        if: steps.browser.outcome == 'failure'
        run: pnpm --filter @loica-ui/docs exec playwright install chromium

      - name: Check the stories with axe
        run: pnpm --filter @loica-ui/docs check:a11y --shard ${{ matrix.shard }}/2

  examples:
    name: Examples (${{ matrix.example }})
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [example-next-app, example-vite]
    defaults:
      run:
        working-directory: apps/${{ matrix.example }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.example }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # The one check that branch protection requires: a job skipped by the path filter counts as passed, a failed
  # or cancelled one blocks the merge.
  required:
    name: Required
    if: always()
    needs: [changes, checks, accessibility, examples]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
