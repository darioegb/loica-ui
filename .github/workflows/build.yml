name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      library: ${{ steps.filter.outputs.library }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - name: Detect the changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            library:
              - 'packages/**'
              - 'apps/docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/build.yml'
              - '.github/composite-actions/**'
            examples:
              - 'apps/example-*/**'
              - 'packages/react/**'
              - 'scripts/check-examples.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/build.yml'
              - '.github/composite-actions/**'

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/common

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test and coverage
        run: pnpm run test:coverage

      - name: Check the package
        run: pnpm --filter @loica-ui/react check:package

      - name: Check the size budget
        run: pnpm --filter @loica-ui/react check:size

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  accessibility:
    name: Accessibility (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/composite-actions/common

      - name: Build docs
        run: pnpm build:docs

      - name: Install the browser and its system packages
        id: browser
        continue-on-error: true
        timeout-minutes: 4
        run: pnpm --filter @loica-ui/docs exec playwright install --with-deps chromium

      # The system libraries come with the runner image; --with-deps only adds fonts through apt, whose mirrors can be down.
      - name: Install the browser alone when apt fails
        if: steps.browser.outcome == 'failure'
        run: pnpm --filter @loica-ui/docs exec playwright install chromium

      - name: Check the stories with axe
        run: pnpm --filter @loica-ui/docs check:a11y --shard ${{ matrix.shard }}/2

  visual:
    name: Visual
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/common

      # The pull request is checked out as a merge, so its first parent is the base it goes into.
      - name: Find the base
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Restore the build of the base
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/base-static
          key: visual-base-${{ steps.base.outputs.sha }}

      - name: Build docs of the base
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          cd "$RUNNER_TEMP/base"
          HUSKY=0 pnpm install --frozen-lockfile
          pnpm build:docs
          mv apps/docs/storybook-static "$RUNNER_TEMP/base-static"

      - name: Build docs
        run: pnpm build:docs

      - name: Install the browser and its system packages
        id: browser
        continue-on-error: true
        timeout-minutes: 4
        run: pnpm --filter @loica-ui/docs exec playwright install --with-deps chromium

      - name: Install the browser alone when apt fails
        if: steps.browser.outcome == 'failure'
        run: pnpm --filter @loica-ui/docs exec playwright install chromium

      # A change of look is allowed with the `visual-change` label. It is read here, not from the event, so adding
      # the label and re-running this job is enough.
      - name: Read the labels
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '.labels[].name' | grep -qx 'visual-change'; then
            echo "flag=--allow-changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare the look of the stories with the base
        run: pnpm --filter @loica-ui/docs check:visual --base "$RUNNER_TEMP/base-static" ${{ steps.intent.outputs.flag }}

      - name: Upload the pictures that changed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: apps/docs/visual-report
          if-no-files-found: ignore
          retention-days: 14

  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/composite-actions/common

      - name: Build the package
        run: pnpm turbo run build --filter=@loica-ui/react

      - name: Build the examples against the packed package
        run: pnpm check:examples

  # The one check that branch protection requires: a job skipped by the path filter counts as passed, a failed
  # or cancelled one blocks the merge.
  required:
    name: Required
    if: always()
    needs: [changes, checks, accessibility, visual, examples]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
