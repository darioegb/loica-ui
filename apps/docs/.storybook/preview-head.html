<style>
  @layer theme, base, plume, components, utilities;
</style>
<script>
  // Applies the saved (or preferred) color mode before the first paint, so a page opened in dark mode
  // doesn't show the light theme until React has mounted.
  try {
    var mode = localStorage.getItem('plume-colormode')
    if (mode !== 'dark' && mode !== 'light') {
      mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    var root = document.documentElement
    root.setAttribute('data-plume-color-mode', mode)
    root.setAttribute('data-bs-theme', mode)
    root.style.colorScheme = mode
  } catch (error) {}
</script>
<style>
  /* The boxes that center an example are flex items that can't shrink below their content,
     so on a narrow screen a width such as `36rem; max-width: 100%` overflows and is cut. */
  .docs-story > div > div,
  .sb-main-centered #storybook-root {
    max-width: 100%;
    min-width: 0;
  }

  /* The identity transform of the zoom box makes it the containing block of the fixed popups, which
     would open far from their trigger. */
  .docs-story > div > div {
    transform: none !important;
  }

  /* Bootstrap paints kbd as a tall inline box that runs into the lines around it and touches its
     neighbours, so the keys in the descriptions get their own box, like the inline code. */
  .sbdocs kbd {
    display: inline-block;
    margin: 0 0.15em;
    padding: 0.1em 0.45em;
    border: 1px solid #d4d4d8;
    border-bottom-width: 2px;
    border-radius: 0.3em;
    background-color: #f4f4f5;
    color: #27272a;
    font-size: 0.85em;
    font-weight: 500;
    line-height: 1.3;
    vertical-align: baseline;
    white-space: nowrap;
  }

  html[data-plume-color-mode='dark'] .sbdocs kbd {
    border-color: #52525b;
    background-color: #3f3f46;
    color: #f4f4f5;
  }

  /* A link inside a sentence needs more than its color to stand out from the text around it. */
  .sbdocs p a,
  .sbdocs li a,
  .sbdocs td a {
    text-decoration: underline;
    text-underline-offset: 0.15em;
  }

  /* The default code colors of Storybook fall under 4.5:1 for a few tokens. The import line of a
     component page is always dark (`<Source dark>`), so it keeps the colors of that theme. */
  html:not([data-plume-color-mode='dark']) .sbdocs pre.prismjs:not(.container > .docblock-source pre) .token.class-name {
    color: #0e7490;
  }

  html:not([data-plume-color-mode='dark']) .sbdocs pre.prismjs:not(.container > .docblock-source pre) :is(.token.dom, .token.variable, .token.number, .token.boolean) {
    color: #0f766e;
  }

  html:not([data-plume-color-mode='dark']) .sbdocs pre.prismjs:not(.container > .docblock-source pre) :is(.token.attr-name, .token.property) {
    color: #c81e1e;
  }

  html[data-plume-color-mode='dark'] .sbdocs pre.prismjs .token.comment {
    color: #a1a1aa;
  }

  html[data-plume-color-mode='dark'] .sbdocs pre.prismjs .token.class-name {
    color: #67e8f9;
  }

  html[data-plume-color-mode='dark'] .sbdocs pre.prismjs :is(.token.dom, .token.variable, .token.number, .token.boolean) {
    color: #5eead4;
  }

  html[data-plume-color-mode='dark'] .sbdocs pre.prismjs :is(.token.attr-name, .token.property) {
    color: #fca5a5;
  }

  /* The striped rows of a docs table are lighter than the page, under the brand green. */
  html[data-plume-color-mode='dark'] .sbdocs td a {
    color: #6ee7b7;
  }

  /* The titles and values of a color palette are grey on grey in dark mode. */
  html[data-plume-color-mode='dark'] .docblock-colorpalette div {
    color: #a1a1aa;
  }

  /* The docs skeleton imitates a stock Storybook page, which looks nothing like these pages: keep
     only the spinner. */
  .sb-preparing-docs .sb-previewBlock,
  .sb-preparing-docs .sb-argstableBlock {
    display: none;
  }

  /* Dark-mode overrides for Storybook docs blocks that the DocsContainer theme
     prop leaves white, plus the body text color Bootstrap forces to #212529. The loading
     skeleton covers the page while a page not visited yet loads, so it is themed too. */
  html[data-plume-color-mode='dark'] body {
    background-color: #18181b;
    color: #e4e4e7;
  }

  html[data-plume-color-mode='dark'] .sb-preparing-story,
  html[data-plume-color-mode='dark'] .sb-preparing-docs,
  html[data-plume-color-mode='dark'] .docs-story {
    background-color: #18181b;
  }

  html[data-plume-color-mode='dark'] .sb-argstableBlock,
  html[data-plume-color-mode='dark'] .sb-argstableBlock-body,
  html[data-plume-color-mode='dark'] .sb-argstableBlock-body tr,
  html[data-plume-color-mode='dark'] .sb-argstableBlock th,
  html[data-plume-color-mode='dark'] .sb-argstableBlock td {
    background-color: #27272a !important;
    color: #e4e4e7 !important;
    border-color: #3f3f46 !important;
  }
</style>
