sonar.projectKey=darioegb_loica-ui
sonar.organization=darioegb-1

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=@loica-ui/react
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=packages/react/src

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=**/coverage/lcov.info

sonar.exclusions=packages/react/src/**/tests/**/*, packages/react/src/**/stories/**/*

# One file per language, with the same keys and functions by design.
sonar.cpd.exclusions=packages/react/src/locales/**/*

sonar.issue.ignore.multicriteria=colorpicker,commandpalette,select,progressbar,timepicker,toast,numberinput
sonar.issue.ignore.multicriteria.colorpicker.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.colorpicker.resourceKey=packages/react/src/components/form/colorpicker/**/*
sonar.issue.ignore.multicriteria.commandpalette.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.commandpalette.resourceKey=packages/react/src/components/overlay/commandpalette/**/*
sonar.issue.ignore.multicriteria.select.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.select.resourceKey=packages/react/src/components/form/select/**/*
sonar.issue.ignore.multicriteria.progressbar.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.progressbar.resourceKey=packages/react/src/components/utility/progressbar/**/*
sonar.issue.ignore.multicriteria.timepicker.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.timepicker.resourceKey=packages/react/src/components/form/timepicker/**/*
sonar.issue.ignore.multicriteria.toast.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.toast.resourceKey=packages/react/src/components/overlay/toast/**/*

# NumberInput reads its deprecated format and parse on purpose until 2.0, as the old names of formatValue and parseValue.
sonar.issue.ignore.multicriteria.numberinput.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.numberinput.resourceKey=packages/react/src/components/form/numberinput/numberinput.tsx
